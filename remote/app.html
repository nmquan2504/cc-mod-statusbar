<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1a1a18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Claude remote</title>
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link id="hljs-dark" rel="stylesheet" href="/vendor/hljs-dark.css" media="(prefers-color-scheme: dark)">
<link id="hljs-light" rel="stylesheet" href="/vendor/hljs-light.css" media="(prefers-color-scheme: light)">
<style>
  :root {
    --bg: #1a1a18; --panel: #24241f; --line: #34342d; --text: #ecebe4; --dim: #9b9a90;
    --claude: #d97757; --me: #b4532a; --me-text: #ffffff; --ok: #6fbf73; --bad: #e5675e; --warn: #e0b04a; --link: #7aa7e6;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    /* the chat's and the code's text size, set in Settings (app.js) */
    --fs: 1;
    --top: calc(48px + env(safe-area-inset-top));
    /* how much of the bottom the on-screen keyboard covers, where the browser does not resize for it */
    --kb: 0px;
    /* the reply area's height, measured as it grows (app.js) */
    --foot: calc(108px + env(safe-area-inset-bottom));
  }
  /* light: the phone's choice, unless Settings picked dark; or Settings picked light */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg: #f7f6f1; --panel: #ffffff; --line: #e3e1d7; --text: #23231f; --dim: #6c6b63; --ok: #2e8b3a; --bad: #c4372d; --warn: #a87a10; --link: #2d63b8; }
  }
  :root[data-theme="light"] { --bg: #f7f6f1; --panel: #ffffff; --line: #e3e1d7; --text: #23231f; --dim: #6c6b63; --ok: #2e8b3a; --bad: #c4372d; --warn: #a87a10; --link: #2d63b8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* the one header line */
  .bar { position: fixed; top: 0; left: 0; right: 0; z-index: 10; height: var(--top); padding: env(safe-area-inset-top) 8px 0; display: flex; align-items: center; gap: 4px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .icon { position: relative; flex: none; width: 40px; height: 40px; border: 0; background: none; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; }
  svg.ic { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .caret svg.ic, .task svg.ic { width: 14px; height: 14px; }
  .chev svg.ic { width: 12px; height: 12px; }
  .sub svg.ic, .meta svg.ic { width: 13px; height: 13px; vertical-align: -2px; }
  .send svg.ic, .jump svg.ic { width: 20px; height: 20px; }
  .composer .send svg.ic, .composer .plus svg.ic { width: 18px; height: 18px; }
  .icon:active { background: var(--panel); }
  .title { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; background: none; height: 40px; font-weight: 700; }
  .title-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .caret { color: var(--dim); display: inline-flex; }
  .badge { position: absolute; top: 3px; right: 1px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--claude); color: #fff; font: 700 11px/17px -apple-system, sans-serif; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); flex: none; display: inline-block; }
  .dot.busy { background: var(--claude); animation: pulse 1.2s infinite; }
  .dot.wait { background: var(--warn); }
  @keyframes pulse { 50% { opacity: .35; } }

  /* the conversation */
  main { padding: calc(var(--top) + 12px) 12px calc(var(--foot) + 6px + var(--kb)); }
  .b { max-width: 88%; margin: 0 0 10px; padding: 8px 12px; border-radius: 18px; overflow-wrap: anywhere; }
  .b.me { margin-left: auto; background: var(--me); color: var(--me-text); border-bottom-right-radius: 6px; white-space: pre-wrap; width: fit-content; }
  .b.me a { color: var(--me-text); }
  .b.me a.imglink { font-weight: 600; text-underline-offset: 3px; }
  .b.me.queued { opacity: .55; position: relative; padding-right: 34px; }
  .b.me.queued .unq { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border: 0; border-radius: 13px; background: rgba(0, 0, 0, .25); color: var(--me-text); font-size: 13px; line-height: 26px; padding: 0; }
  .b.me .note { display: block; font-size: calc(12px * var(--fs)); opacity: .85; margin-top: 2px; }
  .b.claude { margin-right: auto; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 6px; width: fit-content; min-width: 0; }
  .suggests { display: flex; flex-wrap: wrap; gap: 6px; margin: -2px 0 12px 4px; }
  .suggest { display: inline-flex; align-items: center; gap: 6px; max-width: 88%; margin: 0; padding: 6px 12px; border: 1px solid var(--claude); border-radius: 16px; background: none; color: var(--claude); font-size: 14px; text-align: left; }
  .suggest svg.ic { width: 14px; height: 14px; flex: none; }
  .suggest span { overflow-wrap: anywhere; }
  .more-tools { margin: 0 0 6px 6px; font: 11.5px var(--mono); color: var(--dim); opacity: .6; }
  .tools { margin: 0 0 10px 6px; font: calc(11.5px * var(--fs))/1.45 var(--mono); color: var(--dim); }
  .tools strong { font-weight: 600; }
  .trow { display: flex; gap: 7px; align-items: center; padding: 1px 0; cursor: pointer; opacity: .7; max-width: 75%; }
  .trow.open { opacity: 1; }
  .trow.ask { opacity: 1; color: var(--claude); }
  .trow.ask svg.ic { width: 14px; height: 14px; margin-left: -3px; }
  .ask-sum { margin: 0 0 4px 17px; max-width: 75%; color: var(--claude); opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tout.ask-out { border-left-color: var(--claude); }
  .tout .aq { color: var(--text); white-space: normal; } .tout .aa { color: var(--claude); margin-bottom: 6px; }
  .trow .name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trow.open .name { white-space: normal; overflow-wrap: anywhere; }
  .trow .chev { color: var(--dim); flex: none; display: inline-flex; }
  .bullet { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
  .bullet.ok { background: var(--ok); } .bullet.bad { background: var(--bad); } .bullet.run { animation: pulse 1.2s infinite; }
  .tout { margin: 2px 0 6px 13px; padding: 4px 8px; border-left: 2px solid var(--line); font: calc(11.5px * var(--fs))/1.45 var(--mono); color: var(--dim); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 50vh; overflow-y: auto; }
  .tout .add { color: var(--ok); } .tout .del { color: var(--bad); }
  .tout .open-diff { color: var(--link); margin-top: 4px; cursor: pointer; }
  .working { margin: 0 0 0 4px; color: var(--claude); font: calc(13px * var(--fs))/1.5 var(--mono); }
  .working .head { display: flex; align-items: center; gap: 6px; }
  .working .stop { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; margin-left: 4px; padding: 0; border: 0; border-radius: 50%; background: var(--claude); flex: none; }
  /* a thin ring turning around Stop while the turn runs */
  .working .stop::before { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid transparent; border-top-color: var(--claude); border-right-color: var(--claude); animation: spin .9s linear infinite; }
  .working .stop .sq { width: 8px; height: 8px; border-radius: 1.5px; background: var(--bg); }
  .working .stop:disabled { opacity: .5; }
  .working .spin { display: inline-flex; animation: spin 2s linear infinite; }
  .working .spin svg.ic { width: 14px; height: 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* the tool running: its line in the text's colour, where those done are dimmed */
  .trow.running { opacity: 1; color: var(--text); }
  /* a long press copies Claude's answer (app.js): no text selection or callout to fight it, and the
     part being held dims until it is copied */
  .b.claude, .b.me { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: pan-y; }
  /* swiped far enough to quote (app.js) */
  .b.claude.quoting { border-color: var(--claude); }
  .b.me.quoting { box-shadow: 0 0 0 2px var(--claude); }
  /* a code block in the chat coloured by highlight.js keeps the block's own background */
  pre code.hljs { background: none; padding: 0; }
  /* a session that ended a turn while another was shown: a dot by its name, and on the drawer's button */
  .srow .name.unread::after { content: ''; display: inline-block; width: 7px; height: 7px; margin-left: 6px; border-radius: 50%; background: var(--link); vertical-align: middle; }
  #open-drawer { position: relative; }
  #open-drawer.unread::after { content: ''; position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--link); }
  /* held: it dims over the second before it is copied */
  .b.copying, .b pre.copying { opacity: .5; transition: opacity 1s linear; }
  /* a task's box on its first line, not in the middle of a task that wraps */
  .working .task { display: flex; align-items: flex-start; gap: 6px; color: var(--dim); }
  .working .task svg.ic { flex: none; width: 13px; height: 13px; margin-top: .25em; } .working .task.doing { color: var(--claude); } .working .task.done span { text-decoration: line-through; }
  .empty { color: var(--dim); text-align: center; padding: 30vh 16px 0; }

  /* markdown inside a bubble */
  .md p { margin: 0 0 8px; } .md > :last-child { margin-bottom: 0; }
  .md h4 { margin: 10px 0 4px; font-size: calc(15px * var(--fs)); } .md > h4:first-child { margin-top: 0; }
  .md ul, .md ol { margin: 0 0 8px; padding-left: 20px; } .md li > ul, .md li > ol { margin: 2px 0 0; }
  .md a { color: var(--link); overflow-wrap: anywhere; }
  .md blockquote { margin: 0 0 8px; padding-left: 10px; border-left: 3px solid var(--line); color: var(--dim); }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; overflow-x: auto; font: calc(12px * var(--fs))/1.4 var(--mono); white-space: pre; margin: 6px 0; }
  code { font: calc(13px * var(--fs)) var(--mono); background: var(--bg); padding: 0 3px; border-radius: 4px; }
  .b.me code { background: rgba(0, 0, 0, .2); }
  /* a code block in your bubble reads as one in Claude's */
  .b.me pre { color: var(--text); }
  .b.me pre code { background: none; }
  .tablewrap { overflow-x: auto; margin: 0 0 8px; }
  .md table { border-collapse: collapse; font-size: calc(13px * var(--fs)); }
  .md th, .md td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; vertical-align: top; }

  /* the composer */
  footer { position: fixed; left: 0; right: 0; bottom: var(--kb); z-index: 10; background: var(--bg); padding: 6px 10px calc(8px + env(safe-area-inset-bottom)); }
  /* as the Claude app has it: one frame, the box the whole width, + and send on a row below */
  .composer { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 10px 10px 8px; }
  .composer:focus-within { border-color: var(--dim); }
  .composer .tools-row { --row-h: 32px; display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 6px; }
  /* the model and effort beside +, left-aligned: each opens its page */
  .facts { flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .facts::-webkit-scrollbar { display: none; }
  .facts .pill { flex: none; box-sizing: border-box; height: var(--row-h); display: inline-flex; align-items: center; border: 1px solid var(--line); background: var(--bg); color: var(--dim); font: 500 12.5px -apple-system, sans-serif; padding: 0 5px; border-radius: 999px; white-space: nowrap; }
  .facts .pill button { height: 100%; display: inline-flex; align-items: center; border: 0; background: none; color: inherit; font: inherit; padding: 0 6px; border-radius: 999px; }
  .facts .pill button:active { background: var(--panel); }
  .facts .pill > .sep { margin: 0; }
  .facts .pill .model { color: var(--text); font-weight: 600; }
  .facts .sep { margin: 0 5px; }
  textarea { resize: none; height: 42px; max-height: 160px; overflow-y: hidden; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 21px; padding: 10px 14px; font-family: inherit; font-size: 15px; line-height: 20px; }
  .composer textarea { display: block; width: 100%; height: 24px; border: 0; border-radius: 0; background: none; padding: 2px 4px; outline: none; }
  .send { flex: none; width: var(--row-h); height: var(--row-h); border-radius: 50%; border: 0; background: var(--claude); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
  .send:disabled { opacity: .5; }
  .jump { position: fixed; right: 14px; bottom: calc(var(--foot) + 8px + var(--kb)); z-index: 11; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); display: inline-flex; align-items: center; justify-content: center; }

  /* the drawer, the session sheet, the files page */
  .scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .45); }
  /* A layer open (the drawer, a sheet, a page): the chat behind it does not scroll, and a swipe that
     reaches a layer's end stops there, so Chrome's address bar does not slide away under it. While
     the bar slides anyway, the viewport grows before a fixed layer does: each layer draws its own
     colour below its bottom too, so the chat never shows through the gap. */
  html.layered, html.layered body { overflow: hidden; overscroll-behavior: none; }
  .scrim, .drawer, .sheet, .page, .dropup, .sessions { overscroll-behavior: contain; }
  .scrim, .drawer { touch-action: none; }
  .drawer .sessions { touch-action: pan-y; }
  .scrim { box-shadow: 0 40vh 0 rgba(0, 0, 0, .45); }
  .drawer, .page, .sheet { box-shadow: 0 40vh 0 var(--bg); }
  .drawer { position: fixed; top: 0; bottom: 0; left: 0; z-index: 21; width: min(84vw, 320px); background: var(--bg); border-right: 1px solid var(--line); padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; transform: translateX(-102%); transition: transform .2s ease; }
  .drawer.open { transform: none; }
  .drawer h3 { margin: 4px 4px 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  .sessions { flex: 1; overflow-y: auto; }
  .srow { width: 100%; display: flex; gap: 10px; align-items: flex-start; text-align: left; border: 0; background: none; padding: 10px; border-radius: 10px; }
  .srow.on { background: var(--panel); }
  .srow .dot { margin-top: 6px; }
  .srow > div { min-width: 0; flex: 1; }
  /* a session a row of three lines at most: each cut with an ellipsis */
  .srow .name, .srow .desc, .srow .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srow .name { font-weight: 700; }
  .srow .sub { color: var(--dim); font-size: 13px; }
  .srow .desc { font-size: 14px; }
  .drawer-foot .ver { color: var(--dim); font-size: 12px; text-align: center; }
  .drawer-foot { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
  .plain { border: 1px solid var(--line); background: none; border-radius: 10px; padding: 9px 12px; text-align: left; }
  .plain.warn { color: var(--bad); border-color: var(--bad); }
  /* the chat's own text, at the size Settings picked */
  #chat { font-size: calc(15px * var(--fs)); }
  /* the drawer's way to Settings */
  .setbtn { display: flex; align-items: center; gap: 8px; }
  .setbtn svg.ic { width: 18px; height: 18px; color: var(--dim); }
  /* Settings */
  .card.set { padding: 4px 12px 8px; margin-top: 12px; }
  .card.set .seg { margin: 8px 0 4px; }
  .card.set .prow .pr { max-width: 60%; }
  .card.set .psel { max-width: 100%; text-overflow: ellipsis; }
  .card.set .prow > .seg { margin-top: 8px; }
  .card.set .play { width: 32px; height: 32px; color: var(--claude); }
  .card.set .play svg.ic { width: 18px; height: 18px; fill: currentColor; }
  .card.set .hint { padding: 4px 0 6px; }
  .unpair { display: block; width: 100%; margin-top: 4px; text-align: center; color: var(--bad); border-color: var(--bad); font-weight: 600; }
  .unpair.armed { background: var(--bad); color: #fff; }
  .meta.center { text-align: center; }
  .card.set .size { display: flex; align-items: center; gap: 6px; }
  .card.set .size .pbtn { min-width: 40px; }
  .card.set .size .pv { min-width: 44px; text-align: center; }
  .card.set .b.claude.preview { margin: 4px 0 8px; font-size: calc(15px * var(--fs)); max-width: 100%; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
  .sheet h2 { margin: 0 0 4px; font-size: 18px; overflow-wrap: anywhere; }
  .meta { color: var(--dim); font-size: 13px; overflow-wrap: anywhere; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; }
  .chip { font: 12px var(--mono); padding: 3px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); }
  .chip.warn { color: var(--warn); border-color: var(--warn); } .chip.bad { color: var(--bad); border-color: var(--bad); }
  .page { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; padding: 0 12px calc(20px + env(safe-area-inset-bottom)); }
  .page-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 4px; background: var(--bg); padding-top: env(safe-area-inset-top); height: var(--top); margin: 0 -12px; padding-left: 8px; padding-right: 12px; border-bottom: 1px solid var(--line); }
  .page-head strong { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fsearch { position: relative; margin: 12px 0 0; }
  .fsearch input { display: block; width: 100%; box-sizing: border-box; padding: 9px 40px 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); font: inherit; }
  /* the clear button on a search box: a plain icon, in the text's colours */
  .fsearch button, .finder .clear { position: absolute; top: 50%; right: 4px; transform: translateY(-50%); width: 32px; height: 32px; border: 0; background: none; color: var(--dim); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .fsearch button svg.ic, .finder .clear svg.ic { width: 16px; height: 16px; }
  .finder .field { position: relative; flex: 1; min-width: 0; }
  .finder .field input { width: 100%; box-sizing: border-box; padding-right: 36px; }
  mark { background: rgba(224, 176, 74, .45); color: inherit; border-radius: 2px; }
  /* your messages, before and after where you read */
  /* the mic in the reply area, red while it listens */
  .composer .mic { flex: none; width: var(--row-h); height: var(--row-h); border-radius: 50%; border: 0; background: none; color: var(--dim); display: inline-flex; align-items: center; justify-content: center; padding: 0; margin-left: auto; }
  .composer .mic svg.ic { width: 18px; height: 18px; }
  .composer .mic.on { background: var(--bad); color: #fff; animation: pulse 1.2s infinite; }
  /* Load earlier, atop the chat */
  .earlier { display: block; margin: 0 auto 12px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); color: var(--link); font: inherit; font-size: 13px; }
  .earlier:disabled { color: var(--dim); }
  .earlier .ring { display: none; width: 11px; height: 11px; margin-right: 7px; vertical-align: -1px; border-radius: 50%; border: 1.5px solid var(--line); border-top-color: var(--link); animation: spin .8s linear infinite; }
  .earlier.loading .ring { display: inline-block; }
  /* where the earlier turns will go, while they load */
  .ghost { height: 34px; margin: 0 0 10px; border-radius: 18px; background: linear-gradient(90deg, var(--panel) 30%, var(--line) 50%, var(--panel) 70%) 0 0 / 300% 100%; animation: shimmer 1.3s linear infinite; }
  .ghost.claude { width: 62%; border-bottom-left-radius: 6px; }
  .ghost.me { width: 40%; margin-left: auto; border-bottom-right-radius: 6px; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
  /* the earlier turns, come in */
  .arrived { animation: arrive .45s ease-out both; }
  @keyframes arrive { from { opacity: 0; transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { .ghost, .earlier .ring, .arrived { animation-duration: 0s; } .ghost { animation: none; } }
  /* read aloud: the speaker under Claude's bubble, on the left, clear of the jump buttons */
  .b.claude:has(> .speak) { position: relative; margin-bottom: 34px; }
  .b.claude > .speak { position: absolute; left: 2px; bottom: -30px; width: 28px; height: 28px; border: 0; border-radius: 50%; background: none; color: var(--dim); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .b.claude > .speak svg.ic { width: 16px; height: 16px; }
  .b.claude > .speak.on { color: var(--claude); animation: pulse 1.2s infinite; }
  /* a diff's hunks, each a block to tap and ask about */
  .hblock { border-radius: 6px; cursor: pointer; }
  .hblock.on { background: rgba(217, 119, 87, .14); outline: 1px solid rgba(217, 119, 87, .5); }
  /* the hub not answering: a line under the head */
  .offline { position: fixed; top: var(--top); left: 0; right: 0; z-index: 9; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); color: var(--warn); font-size: 13px; text-align: center; }
  .offline.gone { color: var(--bad); }
  .offline .spin { display: inline-flex; animation: spin 2s linear infinite; }
  .offline .spin svg.ic { width: 13px; height: 13px; }
  /* a session's context in the drawer: a ring filled to its percent */
  .ctxring { flex: none; align-self: center; position: relative; width: 26px; height: 26px; border-radius: 50%; background: conic-gradient(var(--ok) calc(var(--p) * 1%), var(--line) 0); display: inline-flex; align-items: center; justify-content: center; }
  .ctxring.warn { background: conic-gradient(var(--warn) calc(var(--p) * 1%), var(--line) 0); }
  .ctxring.bad { background: conic-gradient(var(--bad) calc(var(--p) * 1%), var(--line) 0); }
  .ctxring::before { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--bg); }
  .ctxring span { position: relative; font: 600 9px var(--mono); color: var(--dim); }
  .pnav { position: fixed; right: 14px; bottom: calc(var(--foot) + 54px + var(--kb)); z-index: 11; display: flex; flex-direction: column; gap: 6px; }
  .pnav button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .pnav svg.ic { width: 16px; height: 16px; }
  /* ↑ ↓ and Newest see-through, so the chat under them still reads; whole while pressed */
  .pnav button, .jump { background: color-mix(in srgb, var(--panel) 35%, transparent); border-color: color-mix(in srgb, var(--line) 60%, transparent); opacity: .55; transition: opacity .15s; }
  .pnav button:active, .jump:active { opacity: 1; background: var(--panel); }
  .b.flash { outline: 2px solid var(--claude); outline-offset: 2px; transition: outline-color 1s; }
  /* the quote over the reply box: who wrote it and its first two lines */
  .quote { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 8px; padding: 8px 6px 8px 10px; border-radius: 12px; background: var(--bg); }
  .quote .qmark { flex: none; color: var(--claude); display: inline-flex; margin-top: 1px; }
  .quote .qmark svg.ic { width: 14px; height: 14px; fill: currentColor; stroke: none; }
  .quote .qbody { flex: 1; min-width: 0; }
  .quote .qwho { font-size: 12px; font-weight: 600; }
  .quote .qtext { font-size: 13px; color: var(--dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
  .quote button { flex: none; width: 26px; height: 26px; border: 0; background: none; color: var(--dim); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .quote button svg.ic { width: 14px; height: 14px; }
  .sgroup { margin: 4px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); }
  .shit { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; padding: 8px; font: 12px/1.45 var(--mono); color: var(--text); }
  .shit:first-child { border-top: 0; }
  .shit .at { color: var(--link); }
  .shit .line { display: block; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* find in the open file */
  .finder { position: sticky; top: var(--top); z-index: 1; display: flex; align-items: center; gap: 6px; margin: 0 -12px; padding: 6px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .finder input { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); font: inherit; }
  .finder .count { font: 12px var(--mono); color: var(--dim); min-width: 3em; text-align: right; }
  .finder button { width: 32px; height: 32px; }
  .codeview .hit { position: absolute; left: 0; right: 0; background: rgba(224, 176, 74, .18); pointer-events: none; }
  .codeview .hit.on { background: rgba(224, 176, 74, .45); }
  .seg { display: flex; margin: 12px 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { flex: 1; border: 0; background: none; padding: 8px; font-weight: 600; color: var(--dim); }
  .seg button.on { background: var(--panel); color: var(--text); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; margin-bottom: 12px; }
  .card h3 { margin: 8px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  .file { display: flex; justify-content: space-between; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); font: 13px var(--mono); cursor: pointer; }
  .card h3 + .file { border-top: 0; }
  .file .path { overflow-wrap: anywhere; color: var(--link); }
  .add { color: var(--ok); } .del { color: var(--bad); } .hunk { color: var(--link); } .ctx { color: var(--dim); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  .diff { font: calc(12px * var(--fs))/1.45 var(--mono); white-space: pre; overflow-x: auto; padding-top: 12px; }
  .diff div { min-height: 1.45em; }
  .viewer img { max-width: 100%; margin-top: 12px; }
  .none { color: var(--dim); text-align: center; padding: 40px 0; }
  .seg button { padding: 8px 2px; font-size: 13px; }
  .roots { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .crumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; margin: 0 0 8px; font: 13px var(--mono); color: var(--dim); }
  .crumbs button { border: 0; background: none; color: var(--link); padding: 4px 2px; font: inherit; }
  .crumbs svg.ic { width: 12px; height: 12px; }
  .card.tree { padding: 2px 4px; }
  .trow-file { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 8px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; font: 14px var(--mono); }
  .trow-file:first-child { border-top: 0; }
  .trow-file svg.ic { width: 17px; height: 17px; color: var(--dim); }
  .trow-file .fname { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .trow-file .fsize { color: var(--dim); font-size: 12px; }
  .trow-file .ctxdot { color: var(--claude); font-size: 11px; }
  .trow-file.locked { opacity: .55; }
  .meta.pad { padding: 8px 0; }
  .codeview { position: relative; display: flex; margin: 0 -12px; border-top: 1px solid var(--line); font: calc(12px * var(--fs))/1.5 var(--mono); }
  .codeview pre { margin: 0; border: 0; border-radius: 0; padding: 8px; font: inherit; background: none; }
  .codeview .gutter { color: var(--dim); text-align: right; user-select: none; border-right: 1px solid var(--line); flex: none; cursor: pointer; }
  .codeview .linemark { position: absolute; left: 0; right: 0; background: rgba(217, 119, 87, .18); pointer-events: none; }
  /* the box under a file that asks Claude about a line: the reply area's frame (.composer) */
  .lineask { position: sticky; bottom: 0; margin: 8px -12px 0; padding: 6px 10px calc(8px + env(safe-area-inset-bottom)); background: var(--bg); }
  .lineask .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 2px 6px 6px; }
  .lineask .hint { opacity: .7; }
  .lineask .what { min-width: 0; font: 12px var(--mono); color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lineask .close { flex: none; width: 28px; height: 28px; border: 0; border-radius: 50%; background: var(--panel); color: var(--dim); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .lineask .close svg.ic { width: 14px; height: 14px; }
  .lineask .status { flex: 1; min-width: 0; padding-left: 4px; font-size: 13px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lineask .busy { display: inline-flex; align-items: center; gap: 4px; color: var(--claude); }
  .lineask .spin { display: inline-flex; animation: spin 2s linear infinite; }
  .lineask .spin svg.ic { width: 13px; height: 13px; }
  .lineask .err { color: var(--bad); }
  .lineask .link { border: 0; background: none; color: var(--link); padding: 0; font: inherit; }
  .fbranch { margin-left: auto; display: inline-flex; align-items: center; gap: 2px; color: var(--dim); }
  .codeview .src { flex: 1; min-width: 0; overflow-x: auto; }
  .codeview .src code.hljs { background: none; padding: 0; font: inherit; }

  /* Claude's questions */
  .q { margin: 16px 0 20px; }
  .q .qh { display: inline-block; font: 600 11px/1 -apple-system, sans-serif; text-transform: uppercase; letter-spacing: .06em; color: #fff; background: var(--claude); border-radius: 6px; padding: 4px 7px; margin-bottom: 6px; }
  .q .qt { font-weight: 700; font-size: 16px; }
  .q .qd { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .opt { width: 100%; display: flex; gap: 10px; align-items: flex-start; text-align: left; margin-top: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: none; }
  .opt.on { border-color: var(--claude); background: var(--panel); }
  .opt .mk { flex: none; width: 18px; height: 18px; margin-top: 1px; border: 2px solid var(--dim); border-radius: 50%; }
  .opt .mk.box { border-radius: 5px; }
  .opt.on .mk { border-color: var(--claude); background: var(--claude); box-shadow: inset 0 0 0 3px var(--bg); }
  .prow { border-top: 1px solid var(--line); padding: 9px 0; }
  .card h3 + .prow, .card > .prow:first-child { border-top: 0; }
  .prow .ph { display: flex; align-items: center; gap: 10px; }
  .prow .pt { flex: 1; min-width: 0; }
  .prow .pl { overflow-wrap: anywhere; }
  .prow .pd { color: var(--dim); font-size: 12.5px; overflow-wrap: anywhere; }
  .prow .pr { flex: none; display: flex; align-items: center; gap: 6px; max-width: 45%; }
  .prow .pv { color: var(--dim); font: 13px var(--mono); text-align: right; overflow-wrap: anywhere; }
  .prow.tone-good .pv { color: var(--ok); } .prow.tone-warn .pv { color: var(--warn); } .prow.tone-bad .pv { color: var(--bad); }
  .prow.tap { cursor: pointer; }
  .prow .mk { width: 18px; height: 18px; border: 2px solid var(--dim); border-radius: 50%; }
  .prow .mk.on { border-color: var(--claude); background: var(--claude); box-shadow: inset 0 0 0 3px var(--panel); }
  .prow.busy { opacity: .5; pointer-events: none; }
  .prow.locked .pr svg.ic { width: 14px; height: 14px; color: var(--dim); }
  .switch { width: 42px; height: 24px; border-radius: 12px; border: 0; background: var(--line); position: relative; padding: 0; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--text); transition: left .15s; }
  .switch.on { background: var(--claude); } .switch.on::after { left: 21px; background: #fff; }
  .psel, .pin input { font: inherit; font-size: 14px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; min-width: 0; }
  .pin { display: flex; gap: 6px; margin-top: 6px; }
  .pin input { flex: 1; }
  .pbtn { font: 600 13px -apple-system, sans-serif; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; }
  .pbtn.danger { color: var(--bad); border-color: var(--bad); }
  .pbtn:disabled { opacity: .4; }
  .perr { color: var(--bad); border: 1px solid var(--bad); border-radius: 10px; padding: 8px 10px; margin-bottom: 12px; }
  .opt .ol { font-weight: 600; } .opt .od { color: var(--dim); font-size: 13px; }
  .q pre.preview { margin: 6px 0 0; }
  .q textarea.other { width: 100%; margin-top: 8px; height: auto; min-height: 42px; border-radius: 12px; overflow-y: auto; }
  .stepper { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .stepper button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-size: 18px; }
  .stepper .val { font: 700 18px var(--mono); color: var(--claude); min-width: 60px; text-align: center; }
  .ask-actions { position: sticky; bottom: 0; display: flex; gap: 8px; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); margin: 0 -12px; padding-left: 12px; padding-right: 12px; }
  .ask-actions button { flex: 1; text-align: center; font-weight: 700; }
  .primary { border: 0; border-radius: 10px; padding: 10px 12px; background: var(--claude); color: #fff; }
  .primary:disabled { opacity: .5; }
  .b.ask { cursor: pointer; border-color: var(--claude); }
  .b.ask .qt { font-weight: 700; } .b.ask .go { color: var(--link); font-size: calc(13px * var(--fs)); margin-top: 4px; }
  .b.ask.perm { cursor: default; } .b.ask.perm .go { color: var(--dim); }
  .b.ask.perm pre.call { margin: 6px 0 4px; white-space: pre-wrap; overflow-wrap: anywhere; font: calc(12.5px * var(--fs))/1.4 var(--mono); background: rgba(0, 0, 0, .18); border-radius: 8px; padding: 6px 8px; }
  /* the + menu and what it opens */
  .plus { width: var(--row-h); height: var(--row-h); border-radius: 50%; border: 1px solid var(--line); background: var(--panel); }
  .plus.on { border-color: var(--claude); color: var(--claude); }
  .dropup { position: fixed; left: 12px; right: 12px; bottom: calc(var(--foot) + 4px + var(--kb)); z-index: 12; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 6px; box-shadow: 0 8px 30px rgba(0, 0, 0, .35); }
  .dropup .item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 10px; border: 0; background: none; border-radius: 10px; text-align: left; }
  .dropup .item:active { background: var(--bg); }
  .dropup .item svg.ic { width: 20px; height: 20px; color: var(--dim); }
  .dropup .item .t { font-weight: 600; } .dropup .item .d { color: var(--dim); font-size: 12px; }
  .slash { max-height: 45vh; overflow-y: auto; padding: 4px; }
  .slash .item { display: block; padding: 8px 10px; }
  .slash .item .n { font: 600 14px var(--mono); color: var(--claude); }
  .slash .item .d { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slash .item.computeronly .n { color: var(--dim); }
  .slash .item .tag { margin-left: 8px; font: 600 10px -apple-system, sans-serif; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; vertical-align: 2px; }
  .pickbar { margin: 12px 0 0; padding: 8px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--claude); color: var(--claude); font-size: 13px; }
  .form { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .form input { height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 0 12px; font: 14px var(--mono); }
  .form details summary { color: var(--dim); font-size: 13px; padding: 4px 0; }
  .search { width: 100%; height: 40px; margin: 12px 0 4px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 0 12px; font: 14px inherit; }
  .cmd { width: 100%; display: block; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; padding: 9px 2px; }
  .card h3 + .cmd { border-top: 0; }
  .cmd .n { font: 600 14px var(--mono); color: var(--claude); } .cmd .d { color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
  /* what a command sent from here printed, or why it did not run */
  pre.cmdout { margin: 0 0 10px 4px; max-width: 92%; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--dim); }
  pre.cmdout.bad { color: var(--bad); border-color: var(--bad); white-space: normal; font: calc(13px * var(--fs))/1.45 -apple-system, sans-serif; }
  .cmd.computeronly .n { color: var(--dim); }
  .cmd .tag { margin-left: 8px; font: 600 10px -apple-system, sans-serif; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; vertical-align: 2px; }
  /* /usage */
  .card.usage { padding: 4px 12px 10px; margin-top: 12px; }
  .meter { margin: 10px 0 4px; }
  .meter .mh { display: flex; justify-content: space-between; font-size: 14px; }
  .meter .track { height: 8px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); margin: 6px 0 4px; overflow: hidden; }
  .meter .fill { height: 100%; background: var(--ok); } .meter .fill.warn { background: var(--warn); } .meter .fill.bad { background: var(--bad); }
  .toast.tap { cursor: pointer; }
  .toast { touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .toast { position: fixed; left: 12px; right: 12px; top: calc(var(--top) + 8px); z-index: 40; background: var(--panel); border: 1px solid var(--claude); border-radius: 12px; padding: 10px 12px; }
  .paste { display: flex; gap: 8px; margin-top: 16px; }
  .paste input { flex: 1; min-width: 0; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 0 12px; font: 13px var(--mono); }
  .gate { max-width: 420px; margin: 20vh auto 0; padding: 0 16px; text-align: center; }
  .gate .left { color: var(--dim); font: 600 14px var(--mono); margin-top: 6px; } .gate .left.low { color: var(--warn); }
  .code { font: 700 40px var(--mono); letter-spacing: .2em; color: var(--claude); margin-top: 12px; }
</style>
</head>
<body>
<div id="gate" class="gate" hidden>
  <h2>Claude remote</h2>
  <p id="gate-text" data-t="Scan the QR code in the terminal (⇄ on the status bar).">Scan the QR code in the terminal (⇄ on the status bar).</p>
  <div id="gate-code" class="code" hidden></div>
  <div id="gate-left" class="left" hidden></div>
  <div id="gate-paste" class="paste" hidden>
    <input id="gate-link" type="url" placeholder="https://…trycloudflare.com/#k=…" autocomplete="off" aria-label="The remote's link">
    <button id="gate-go" class="primary" data-t="Pair">Pair</button>
  </div>
  <p class="meta" data-t="Everything between this phone and your Mac is encrypted end to end: Cloudflare carries it but cannot read it.">Everything between this phone and your Mac is encrypted end to end: Cloudflare carries it but cannot read it.</p>
</div>

<div id="app" hidden>
  <header class="bar">
    <button id="open-drawer" class="icon" aria-label="Sessions" data-icon="menu"></button>
    <button id="title" class="title" aria-label="Session details"><span id="dot" class="dot"></span><span id="title-text" class="title-text">Claude</span><span class="caret" data-icon="chevronDown"></span></button>
    <button id="open-files" class="icon" aria-label="Files and images" data-icon="folder"><span id="files-badge" class="badge" hidden></span></button>
  </header>
  <div id="offline" class="offline" role="status" hidden></div>
  <main id="chat"></main>
  <footer>
    <div class="composer">
      <div id="quote" class="quote" hidden>
        <span class="qmark" data-icon="quote"></span>
        <div class="qbody"><div id="quote-who" class="qwho"></div><div id="quote-text" class="qtext"></div></div>
        <button id="unquote" class="icon" aria-label="Remove the quote" data-icon="close"></button>
      </div>
      <textarea id="text" rows="1" placeholder="Reply" aria-label="Reply to Claude"></textarea>
      <div class="tools-row">
        <button id="plus" class="icon plus" aria-label="Add to the reply" data-icon="plus"></button>
        <div id="facts" class="facts"></div>
        <button id="mic" class="icon mic" aria-label="Speak" data-icon="mic" hidden></button>
        <button id="send" class="send" aria-label="Send" data-icon="arrowUp"></button>
      </div>
    </div>
  </footer>
</div>
<div id="pnav" class="pnav" hidden>
  <button id="prev-prompt" class="icon" aria-label="Your message before" data-icon="chevronUp"></button>
  <button id="next-prompt" class="icon" aria-label="Your message after" data-icon="chevronDown"></button>
</div>
<button id="jump" class="jump" aria-label="Newest" data-icon="arrowDown" hidden></button>
<div id="plus-menu" class="dropup" hidden></div>
<div id="slash" class="dropup slash" hidden></div>

<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" aria-label="Sessions">
  <h3 data-t="Sessions">Sessions</h3>
  <div id="sessions" class="sessions"></div>
  <div class="drawer-foot">
    <button id="open-settings" class="plain setbtn" data-icon="gear"><span data-t="Settings">Settings</span></button>
    <div id="version" class="ver"></div>
  </div>
</aside>
<div id="sheet" class="sheet" hidden></div>

<div id="files" class="page" hidden>
  <div class="page-head">
    <button id="close-files" class="icon" aria-label="Back" data-icon="back"></button>
    <strong data-t="Files &amp; images">Files &amp; images</strong>
  </div>
  <div class="fsearch"><input id="files-q" type="text" placeholder="Search file names and contents" aria-label="Search files" autocomplete="off" enterkeyhint="search"><button id="files-q-clear" class="icon" aria-label="Clear the search" data-icon="close" hidden></button></div>
  <div class="seg">
    <button id="seg-folder" class="on" data-t="Folder">Folder</button>
    <button id="seg-context" data-t="Context">Context</button>
    <button id="seg-changes" data-t="Changes">Changes</button>
    <button id="seg-images" data-t="Images">Images</button>
  </div>
  <div id="files-body"></div>
</div>

<div id="ask" class="page" hidden>
  <div class="page-head">
    <button id="close-ask" class="icon" aria-label="Back" data-icon="back"></button>
    <strong data-t="Claude asks">Claude asks</strong>
  </div>
  <div id="ask-body"></div>
  <div class="ask-actions">
    <button id="ask-dismiss" class="plain" data-t="Dismiss">Dismiss</button>
